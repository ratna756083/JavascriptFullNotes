<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Keyboard events</h1>

    <h3>
        1.keypress-->onkeypress
        2.keydown--->onkeydown
        3.keyup--->onkeyup
    </h3>
    <h4>keyboard events using dom elements</h4>
    <input type="text">

    <script>
        let input=document.querySelector('input')
        input.onkeypress=()=>{
            console.log('key pressed')
        }

        input.onkeydown=()=>{
            console.log('key down')
        }

        input.onkeyup=()=>{
            console.log('key up')
        }
        // input.onkeypress=()=>{
        //     console.log('hello') //it is override  the previous event
        // }
    </script>
</body>
</html>
